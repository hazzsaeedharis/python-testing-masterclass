name: 🧪 Testing CI/CD Pipeline

# When to run this workflow
on:
  # Run on every push to main branch
  push:
    branches: [ main, master ]
  
  # Run on every pull request to main
  pull_request:
    branches: [ main, master ]
  
  # Allow manual triggering from GitHub UI
  workflow_dispatch:

# Define jobs to run
jobs:
  # ============================================================================
  # JOB 1: UNIT AND INTEGRATION TESTS
  # ============================================================================
  unit-and-integration-tests:
    name: 🔬 Unit & Integration Tests
    runs-on: ubuntu-latest
    
    # Test against multiple Python versions
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      # Step 1: Checkout the code
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      # Step 2: Set up Python
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'  # Cache pip dependencies for faster builds
      
      # Step 3: Install dependencies
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # Step 4: Run unit tests
      - name: 🧪 Run Unit Tests
        run: |
          pytest test_unit.py -v --tb=short
      
      # Step 5: Run integration tests
      - name: 🔗 Run Integration Tests
        run: |
          pytest test_integration.py -v --tb=short
      
      # Step 6: Generate coverage report
      - name: 📊 Generate Coverage Report
        run: |
          pytest test_unit.py test_integration.py --cov=todo_app --cov-report=xml --cov-report=term
      
      # Step 7: Upload coverage to Codecov (optional)
      - name: 📈 Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false  # Don't fail if Codecov is down

  # ============================================================================
  # JOB 2: END-TO-END TESTS
  # ============================================================================
  e2e-tests:
    name: 🎭 End-to-End Tests
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      # Step 2: Set up Python
      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      # Step 3: Install dependencies
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # Step 4: Start the API server in background
      - name: 🚀 Start API Server
        run: |
          python todo_app.py &
          echo "API_PID=$!" >> $GITHUB_ENV
        env:
          PYTHONUNBUFFERED: 1
      
      # Step 5: Wait for server to be ready
      - name: ⏳ Wait for Server
        run: |
          timeout 30 bash -c 'until curl -f http://localhost:8000/; do sleep 2; done'
      
      # Step 6: Run E2E tests
      - name: 🎬 Run E2E Tests
        run: |
          pytest test_e2e.py -v -s --tb=short
      
      # Step 7: Stop the server (cleanup)
      - name: 🛑 Stop API Server
        if: always()
        run: |
          kill $API_PID || true

  # ============================================================================
  # JOB 3: CODE QUALITY CHECKS
  # ============================================================================
  code-quality:
    name: ✨ Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 mypy
      
      # Check code formatting with Black
      - name: 🎨 Check Code Formatting (Black)
        run: |
          black --check --diff todo_app.py test_*.py || true
        continue-on-error: true  # Don't fail, just warn
      
      # Check code style with flake8
      - name: 📏 Check Code Style (Flake8)
        run: |
          flake8 todo_app.py test_*.py --max-line-length=100 --ignore=E203,W503 || true
        continue-on-error: true
      
      # Type checking with mypy
      - name: 🔍 Type Checking (MyPy)
        run: |
          mypy todo_app.py --ignore-missing-imports || true
        continue-on-error: true

  # ============================================================================
  # JOB 4: BUILD STATUS SUMMARY
  # ============================================================================
  build-success:
    name: ✅ All Tests Passed
    runs-on: ubuntu-latest
    needs: [unit-and-integration-tests, e2e-tests, code-quality]
    
    steps:
      - name: 🎉 Success Message
        run: |
          echo "================================================"
          echo "✅ All tests passed successfully!"
          echo "================================================"
          echo "✓ Unit Tests: PASSED"
          echo "✓ Integration Tests: PASSED"
          echo "✓ E2E Tests: PASSED"
          echo "✓ Code Quality: CHECKED"
          echo "================================================"
          echo "🚀 Ready to merge!"
